publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.14.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  bitnet_flutter_ai:
    path: ../
  material_ui: ^1.11.0

dev_dependencies:
