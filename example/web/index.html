<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="BitNet Flutter AI example — on-device LLM inference.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="BitNet Example">
  <title>BitNet Flutter AI</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Cross-Origin Isolation bootstrap.
    The COI service worker injects the COOP/COEP headers needed for
    SharedArrayBuffer, which is required by the BitNet WASM module.
    This snippet registers it on first load and reloads once.
  -->
  <script>
    if (typeof SharedArrayBuffer === 'undefined') {
      var reloaded = sessionStorage.getItem('coi-reload');
      if (!reloaded) {
        sessionStorage.setItem('coi-reload', '1');
        navigator.serviceWorker.register('/coi_service_worker.js')
          .then(function() { location.reload(); });
      } else {
        sessionStorage.removeItem('coi-reload');
      }
    }
  </script>

  <!--
    BitNet WASM glue. bitnet_glue.js spawns a Web Worker (bitnet_worker.js)
    that owns the Emscripten module (bitnet_bridge.js + bitnet_bridge.wasm) so
    model loading and generation run OFF the UI thread, and exposes the async
    window.BitNetWasm used by engine_web.dart. Only this one script is loaded on
    the main thread; the worker importScripts the bridge itself. All four files
    are staged here by `tool/build_web.sh`.
  -->
  <script src="bitnet_glue.js"></script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
