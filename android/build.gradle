group 'com.example.bitnet_flutter_ai'
version '1.0'

buildscript {
    ext.kotlin_version = '2.1.0'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.6.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.example.bitnet_flutter_ai'

    // Align with the host app's compileSdkVersion.
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdk 24
        // BitNet b1.58 currently ships prebuilt binaries for arm64-v8a (real
        // devices) and x86_64 (Android emulator on Intel/AMD dev machines).
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    // Native libraries are shipped prebuilt inside src/main/jniLibs/<abi>/.
    // Gradle's default packagingOptions will pick them up; we don't need to
    // recompile via externalNativeBuild on every consumer's machine.
    packagingOptions {
        jniLibs {
            useLegacyPackaging false
            // Keep the bundled .so files even when the host app strips
            // unused libraries.
            pickFirsts += [
                '**/libbitnet_bridge.so',
                '**/libllama.so',
                '**/libggml.so',
                '**/libomp.so',
            ]
        }
    }

    dependencies {
        implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()
        }
    }
}
