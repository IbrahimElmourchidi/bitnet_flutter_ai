group 'com.example.bitnet_flutter_ai'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.example.bitnet_flutter_ai'

    // Align with the host app's compileSdkVersion.
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdk 24
        // BitNet b1.58 requires arm64; filter out other ABIs at the plugin level.
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                // Pass the paths to the prebuilt llama artefacts.
                // Set these in your local.properties or as environment variables
                // before running `flutter build apk`.
                // Example:
                //   LLAMA_INCLUDE_DIR=/path/to/bitnet.cpp/include
                //   LLAMA_LIB=/path/to/bitnet.cpp/android/arm64-v8a/libllama.so
                def llamaInclude = System.getenv("LLAMA_INCLUDE_DIR") ?: ""
                def llamaLib     = System.getenv("LLAMA_LIB") ?: ""
                arguments "-DLLAMA_INCLUDE_DIR=${llamaInclude}",
                          "-DLLAMA_LIB=${llamaLib}"
                cppFlags "-std=c++17"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            version "3.22.0"
        }
    }

    dependencies {
        implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()
        }
    }
}
