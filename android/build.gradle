group 'org.utanium.bitnet_flutter_ai'
version '0.3.0-beta.1'

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.3.1'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'org.utanium.bitnet_flutter_ai'

    // Align with the host app's compileSdkVersion.
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk 24
        // BitNet b1.58 currently ships prebuilt binaries for arm64-v8a (real
        // devices) and x86_64 (Android emulator on Intel/AMD dev machines).
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    // Native libraries are shipped prebuilt inside src/main/jniLibs/<abi>/.
    // Gradle's default packagingOptions will pick them up; we don't need to
    // recompile via externalNativeBuild on every consumer's machine.
    packaging {
        jniLibs {
            useLegacyPackaging false
            // Keep the bundled .so files even when the host app strips
            // unused libraries.
            pickFirsts += [
                '**/libbitnet_bridge.so',
                '**/libllama.so',
                '**/libggml.so',
                '**/libomp.so',
            ]
        }
    }
}
