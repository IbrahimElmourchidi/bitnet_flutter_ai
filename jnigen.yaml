# jnigen.yaml — Dart bindings for the Android platform APIs used by
# DeviceInspector / ModelCache (memory, thermal, power-save, no-backup dir).
#
# Direct native interop (JNIgen, stable since Dart 3.14) replaces the old
# Kotlin MethodChannel: calls are synchronous and work from any isolate.
#
# Regenerate (needs JDK 17+ and an Android SDK with the listed platform):
#   ANDROID_SDK_ROOT=$HOME/Android/Sdk dart run jnigen --config jnigen.yaml
#
# The output is committed so consumers need no Java toolchain.
android_sdk_config:
  versions: ["36"]

output:
  dart:
    path: lib/src/device/android/android_bindings.dart
    structure: single_file

classes:
  - android.app.ActivityManager
  - android.os.PowerManager
  - android.content.Context
  - java.io.File

preamble: |
  // AUTO-GENERATED by jnigen from jnigen.yaml. DO NOT EDIT.
  // ignore_for_file: type=lint
