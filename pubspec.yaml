name: bitnet_flutter_ai
description: Run Microsoft BitNet b1.58 2B-4T locally on Android, iOS, desktop, and Web (WASM).
version: 0.2.0-beta.1
homepage: https://github.com/IbrahimElmourchidi/bitnet_flutter_ai
repository: https://github.com/IbrahimElmourchidi/bitnet_flutter_ai
issue_tracker: https://github.com/IbrahimElmourchidi/bitnet_flutter_ai/issues
funding:
  - https://pub.dev/publishers/utanium.org/packages

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3
  path_provider: ^2.1.4
  http: ^1.2.2
  crypto: ^3.0.5
  system_info2: ^4.0.0
  plugin_platform_interface: ^2.1.8
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  ffigen: ^12.0.0
  test: ^1.25.0
  mocktail: ^1.0.4
  path_provider_platform_interface: ^2.1.2

flutter:
  plugin:
    platforms:
      android:
        package: com.example.bitnet_flutter_ai
        pluginClass: BitnetFlutterAiPlugin
      ios:
        pluginClass: BitnetFlutterAiPlugin
      linux:
        ffiPlugin: true
  # NOTE: web/coi_service_worker.js, bitnet_glue.js and bitnet_worker.js are
  # deliberately NOT declared as Flutter assets. A package asset resolves to
  # assets/packages/bitnet_flutter_ai/web/<file>, not the site root, so a service
  # worker registered from there could never claim the scope index.html needs —
  # and it would be bundled into every Android/iOS build for nothing. Consumers
  # copy these into their own web/ directory (see "Web Setup" in README.md).
